<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Croquet</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Croquet">
<!-- Only takes effect over http(s); a file:// page cannot be installed. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230B1210'/%3E%3Cpath d='M56 136V97a34 34 0 0 1 68 0v39' fill='none' stroke='%23E9F0EB' stroke-width='11' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='117' r='19' fill='%23E03A2F'/%3E%3Crect x='37' y='142' width='106' height='7' rx='3.5' fill='%2337B24D'/%3E%3C/svg%3E">

<style>
:root{
  --g:#0B1210; --s:#141C19; --z:#1D2723; --l:#2B3833;
  --t:#E9F0EB; --d:#7F9089; --r:15px;
  --acc:#4ADE80;
  --swW:46px;              /* the colour block down the left of each row */
}
*{box-sizing:border-box}
html{background:var(--g)}
body{
  margin:0 auto; max-width:520px;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
  background:var(--g); color:var(--t);
  font:400 16px/1.45 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
  overscroll-behavior-y:contain;
}
button{cursor:pointer;font:inherit}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h2{margin:22px 0 9px;font-size:11px;font-weight:600;color:var(--d);
  letter-spacing:.2em;text-transform:uppercase}

/* ---- header ---- */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:4px}
h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.22em;text-transform:uppercase}
#reset{padding:7px 13px;border:1px solid var(--l);border-radius:99px;
  background:var(--z);color:var(--d);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase}

body[data-view=setup] #game,
body[data-view=game]  #setup{display:none}
body[data-view=setup] #reset{display:none}

/* ---- setup ---- */
/* Balls on the left, sides on the right: the two choices are read together,
   because how many balls are lit decides which team splits are even. */
.pick{display:grid;grid-template-columns:1fr 128px;gap:11px;align-items:start}
.pick h2{margin-top:16px}
#colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cl{display:flex;align-items:center;gap:9px;padding:11px 10px;
  border:1px solid var(--l);border-radius:12px;background:var(--s);
  color:var(--d);font-size:13px;text-align:left}
.cl .chip{opacity:.32;box-shadow:inset 0 0 0 2px var(--ring)}
/* The selected ring is neutral, not the ball's own colour -- a black ring on a
   near-black tile said nothing about whether black was in or out. */
.cl[aria-pressed=true]{background:var(--z);color:var(--t);font-weight:600;
  border-color:#5F7269;box-shadow:inset 0 0 0 1px #5F7269}
.cl[aria-pressed=true] .chip{opacity:1;
  box-shadow:inset 0 0 0 2px var(--ring),0 3px 10px -5px var(--c)}

#tms{display:grid;gap:8px}
#tms button{padding:12px 6px;border:1px solid var(--l);border-radius:12px;
  background:var(--s);color:var(--t);font-size:13px;text-align:center}
#tms button[aria-pressed=true]{background:var(--z);border-color:var(--acc);
  box-shadow:inset 0 0 0 1px var(--acc)}
#tms button[disabled]{opacity:.28;pointer-events:none}

/* Every coloured surface is edged in its ball's ring colour. On the bright
   balls that is a highlight; on black it is the whole outline. */
.chip{width:24px;height:24px;border-radius:50%;background:var(--c);flex:none;
  box-shadow:inset 0 0 0 2px var(--ring),0 3px 10px -5px var(--c)}

#start{width:100%;margin-top:24px;padding:17px 0;border:none;border-radius:var(--r);
  background:var(--acc);color:#06210E;font-size:14px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase}
#start[disabled]{background:var(--z);color:var(--d);
  box-shadow:inset 0 0 0 1px var(--l);pointer-events:none}

/* ---- ball rows ----
   One line per ball so a six-ball game is on screen all at once: who it is,
   what it is dead on, and the point it is playing for. No turn order -- tap
   whichever ball just scored. */
.card{position:relative;overflow:hidden;
  display:flex;align-items:center;gap:9px;
  background:var(--s);border:1px solid var(--l);border-radius:13px;
  padding:7px 10px 7px 0;margin-bottom:6px}
.card[data-out=true]{opacity:.5}

/* The ball's colour is the whole left edge of the row rather than a token
   sitting on it. Negative margins pull it past the row's own padding so it
   reaches both inner edges, and the card's overflow rounds its outer corners. */
.sw{flex:none;width:var(--swW);align-self:stretch;margin:-7px 0;
  background:var(--c);box-shadow:inset -2px 0 0 var(--ring)}

/* The circles take whatever width is left over and shrink rather than wrap, so
   they are as large as the row allows on any handset -- they are tapped mid
   game with one thumb, often in sunlight. */
.dd{display:flex;gap:6px;flex:1 1 auto;justify-content:flex-end;min-width:0}
/* Alive and dead differ in size and outline, not in how dim they are: fading
   the colour made it hard to tell which ball a circle even was. Both states
   are full strength; a live ball is a small plain dot, a dead one swells and
   takes a bright collar. The button keeps its full footprint either way, so
   the tap target never changes. */
.dc{flex:0 1 38px;aspect-ratio:1;min-width:22px;padding:0;
  border:none;background:none;border-radius:50%;
  display:grid;place-items:center}
.dc::before{content:'';width:100%;height:100%;border-radius:50%;
  background:var(--c);transform:scale(.56);
  box-shadow:0 0 0 1.5px var(--ring);
  transition:transform .14s,box-shadow .14s}
.dc[data-on=true]::before{transform:scale(.78);
  box-shadow:0 0 0 2.5px var(--t),0 0 12px -2px var(--c)}

.go,.back{flex:none;height:40px;padding:0;border-radius:10px;
  font-size:20px;line-height:1}
.go{width:58px;border:none;background:var(--c);color:var(--fg);
  box-shadow:inset 0 0 0 1.5px var(--ring)}
.go[disabled]{background:var(--z);color:var(--d);box-shadow:inset 0 0 0 1px var(--l)}
.back{width:44px;border:1px solid var(--l);background:var(--z);color:var(--d)}
.back[disabled]{opacity:.28}

/* Progress starts where the colour block ends, so it does not paint over it. */
.pb{position:absolute;left:var(--swW);bottom:0;height:3px;background:var(--ring);
  transition:width .2s}

/* Narrow handsets: everything gives up a little so the circles stay tappable. */
@media(max-width:380px){
  :root{--swW:34px}
  .card{gap:6px;padding-right:8px}
  .sw{margin:-7px 0}
  .dd{gap:4px}
  .go{width:50px}
  .back{width:38px}
}

/* ---- court ---- */
#court{margin-top:12px;background:var(--s);border:1px solid var(--l);
  border-radius:var(--r);padding:8px 6px 6px}
#court svg{display:block;width:100%;height:auto}
.wk{fill:none;stroke:#5B6E64;stroke-width:3.4;stroke-linecap:round}
.rail{fill:none;stroke:#25322C;stroke-width:2}
.pegm{fill:#8C9A92}
.wn{fill:#67786F;font-size:8px;font-weight:600;text-anchor:middle;
  font-family:ui-sans-serif,system-ui,sans-serif}
.bm{stroke-width:2}
.bm[data-out=true]{opacity:.35}

/* ---- winner ---- */
#banner{display:none;margin:14px 0;padding:14px 16px;border-radius:var(--r);
  background:#12301C;border:1px solid #2E6B45;color:#9BE8B6}
#banner b{display:block;font-size:17px;font-weight:650;margin-bottom:2px}
#banner span{font-size:13px;opacity:.85}
body[data-over=true] #banner{display:block}

/* ---- bottom bar ---- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;max-width:520px;margin:0 auto;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--g) 62%,#0B121000)}
body[data-view=setup] #bar{display:none}
#undo{flex:1;padding:15px 0;border:1px solid var(--l);border-radius:12px;
  background:var(--z);color:var(--t);font-size:13px;font-weight:650;
  letter-spacing:.12em;text-transform:uppercase}
#undo[disabled]{opacity:.35}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-view="setup" data-over="false">

<header>
  <h1>Croquet</h1>
  <button id="reset">New game</button>
</header>

<!-- ===================== SETUP ===================== -->
<section id="setup">
  <div class="pick">
    <div>
      <h2>Balls in play</h2>
      <div id="colors">
        <button class="cl" data-i="0" aria-pressed="true" style="--c:#2B5FCE;--ring:#6A93E8"><span class="chip"></span>Blue</button>
        <button class="cl" data-i="1" aria-pressed="true" style="--c:#E03A2F;--ring:#F0857C"><span class="chip"></span>Red</button>
        <button class="cl" data-i="2" aria-pressed="true" style="--c:#363D47;--ring:#818E9F"><span class="chip"></span>Black</button>
        <button class="cl" data-i="3" aria-pressed="true" style="--c:#EFC01F;--ring:#F7DC77"><span class="chip"></span>Yellow</button>
        <button class="cl" data-i="4" aria-pressed="true" style="--c:#1F6633;--ring:#4E9A69"><span class="chip"></span>Green</button>
        <button class="cl" data-i="5" aria-pressed="true" style="--c:#C96311;--ring:#E9A063"><span class="chip"></span>Orange</button>
      </div>
    </div>
    <div>
      <h2>Sides</h2>
      <div id="tms">
        <button data-v="2" aria-pressed="true">2 teams</button>
        <button data-v="3" aria-pressed="false">3 teams</button>
        <button data-v="0" aria-pressed="false">No teams</button>
      </div>
    </div>
  </div>

  <button id="start">Start game</button>
</section>

<!-- ===================== GAME ===================== -->
<section id="game">
  <div id="banner"></div>
  <div id="cards"></div>
  <div id="court"></div>
</section>

<div id="bar"><button id="undo">Undo</button></div>

<script>
// ---------------------------------------------------------------------------
// The nine-wicket course: one entry per point a ball can score, in the order it
// scores them. A ball's whole state is a single integer -- how far down this
// list it has got -- and everything on screen is derived from that.
// ---------------------------------------------------------------------------
var COURSE = ['Wicket 1','Wicket 2','Wicket 3','Wicket 4','Wicket 5','Wicket 6',
              'Wicket 7',
              'Turning post',
              'Wicket 8','Wicket 9','Wicket 10','Wicket 11','Wicket 12',
              'Wicket 13','Wicket 14',
              'Home post'];

// ---------------------------------------------------------------------------
// The court, drawn long-axis across so it fits under the rows. Home post is at
// the RIGHT, so the balls start on the right, run out to the turning post on
// the left, and come back. Two diamonds share the centre hoop.
//
// Nine hoops carry fourteen wicket points, because the outbound leg runs one
// side of each diamond and the return leg runs the other. `pts` lists which
// points of COURSE each hoop is, which is what puts a ball on the right hoop.
// The outbound-only hoops are the top row and the return-only ones the bottom
// row, which is why a ball drawn above its hoop is always heading out and one
// drawn below is always coming home. x and y are fractions of the box.
// ---------------------------------------------------------------------------
var COURT = [
  { x:0.87, y:0.50, pts:[0, 14] },   // wicket 1 out, wicket 14 home
  { x:0.76, y:0.50, pts:[1, 13] },
  { x:0.63, y:0.30, pts:[2]     },   // lower diamond, outbound side
  { x:0.50, y:0.50, pts:[3, 11] },   // centre
  { x:0.37, y:0.30, pts:[4]     },   // upper diamond, outbound side
  { x:0.24, y:0.50, pts:[5, 9]  },
  { x:0.13, y:0.50, pts:[6, 8]  },
  { x:0.37, y:0.70, pts:[10]    },   // upper diamond, return side
  { x:0.63, y:0.70, pts:[12]    }    // lower diamond, return side
];
var POSTS = [
  { x:0.95, y:0.50, pts:[15], label:'home'    },
  { x:0.05, y:0.50, pts:[7],  label:'turning' }
];
var BOX = { w:320, h:176 };
var GRID = 11.5;                     // centre-to-centre spacing of blocked balls

// Ball order -- blue, red, black, yellow, green, orange -- which is also the
// striping on the post. Hexes are mirrored in the setup markup above.
// Each ball carries three colours: the fill, the text that sits on it, and a
// lighter edge. The edge is what makes black a ball rather than a hole in the
// page -- on the bright colours it reads as a highlight and does no harm, so
// every ball is drawn the same way rather than special-casing one.
var META = [
  { name:'Blue',   hex:'#2B5FCE', fg:'#FFFFFF', ring:'#6A93E8' },
  { name:'Red',    hex:'#E03A2F', fg:'#FFFFFF', ring:'#F0857C' },
  { name:'Black',  hex:'#363D47', fg:'#FFFFFF', ring:'#818E9F' },
  { name:'Yellow', hex:'#EFC01F', fg:'#14180F', ring:'#F7DC77' },
  { name:'Green',  hex:'#1F6633', fg:'#FFFFFF', ring:'#4E9A69' },
  { name:'Orange', hex:'#C96311', fg:'#23120A', ring:'#E9A063' }
];

var KEY = 'croquet.v5';   // earlier games have a different shape; let them lapse
var S = null;             // live game, or null while in setup
var HIST = [];            // JSON snapshots, newest last

function $(id){ return document.getElementById(id); }

// --- persistence ----------------------------------------------------------
// Written after every change: a phone will happily kill a backgrounded tab
// between the sixth wicket and the post.
function save(){
  try {
    if (S) localStorage.setItem(KEY, JSON.stringify({ s:S, h:HIST }));
    else   localStorage.removeItem(KEY);
  } catch (e) {}
}
function restore(){
  try {
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && o.s && o.s.balls) { S = o.s; HIST = o.h || []; return true; }
  } catch (e) {}
  return false;
}

// --- setup ----------------------------------------------------------------
var setup = { on:[true,true,true,true,true,true], teams:2 };

function chosen(){
  var out = [];
  for (var i = 0; i < 6; i++) if (setup.on[i]) out.push(i);
  return out;
}

function syncSetup(){
  var n = chosen().length;

  [].forEach.call($('colors').children, function(b){
    b.setAttribute('aria-pressed', String(setup.on[+b.dataset.i]));
  });

  // Teams have to divide the balls evenly, so an odd count rules out any split
  // and three-way play needs the full six.
  var allow = { '2': n >= 2 && n % 2 === 0, '3': n === 6, '0': true };
  if (!allow[String(setup.teams)]) setup.teams = 0;

  [].forEach.call($('tms').children, function(b){
    b.disabled = !allow[b.dataset.v];
    b.setAttribute('aria-pressed', String(+b.dataset.v === setup.teams));
  });

  $('start').disabled = n < 2;
  $('start').textContent = n < 2 ? 'Pick at least two balls' : 'Start game';
}

$('colors').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var i = +b.dataset.i;
  // Never let the last two balls be switched off -- there is no game below two.
  if (setup.on[i] && chosen().length <= 2) return;
  setup.on[i] = !setup.on[i];
  syncSetup();
});

$('tms').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  setup.teams = +b.dataset.v; syncSetup();
});

$('start').addEventListener('click', function(){
  S = {
    balls: chosen().map(function(c){
      return { c:c, pos:0, out:false, dead:[], hist:[] };
    }),
    teams: setup.teams,
    over: null
  };
  HIST = [];
  document.body.dataset.view = 'game';
  document.body.dataset.over = 'false';
  render(); save();
});

$('reset').addEventListener('click', function(){
  if (!confirm('End this game and start a new one?')) return;
  S = null; HIST = [];
  document.body.dataset.view = 'setup';
  document.body.dataset.over = 'false';
  save(); syncSetup();
});

// --- game mechanics -------------------------------------------------------
// Every mutation goes through here, so undo needs no per-action bookkeeping --
// it just reinstates the snapshot taken before the last thing that happened.
function act(fn){
  HIST.push(JSON.stringify(S));
  if (HIST.length > 80) HIST.shift();
  fn();
  settle();
  render();
  save();
}

// Sides are cut across the ball order, not along it: with six balls and two
// teams that is blue/black/green against red/yellow/orange, and with three
// teams it pairs each colour with the one furthest from it in the order.
function teamBalls(k){
  var out = [];
  for (var i = k; i < S.balls.length; i += S.teams) out.push(i);
  return out;
}
function teamName(k){
  return teamBalls(k).map(function(i){ return META[S.balls[i].c].name; }).join(' & ');
}

function settle(){
  // A side is finished when every one of its balls has staked out.
  S.over = null;
  if (S.teams) {
    for (var k = 0; k < S.teams; k++) {
      var ids = teamBalls(k);
      if (ids.length && ids.every(function(i){ return S.balls[i].out; })) {
        S.over = teamName(k);
      }
    }
  } else {
    for (var i = 0; i < S.balls.length; i++) {
      if (S.balls[i].out) { S.over = META[S.balls[i].c].name; break; }
    }
  }
  document.body.dataset.over = String(!!S.over);
}

// Scoring a point -- wicket or post -- clears this ball's deadness. The marks
// it wiped are stashed on the ball first, so the row's minus button puts them
// back too rather than leaving the row wrongly alive. A copy, not the live
// array: the stashed one must not move when the circles are tapped afterwards.
function scorePoint(i){
  var b = S.balls[i];
  if (b.pos >= COURSE.length) return;
  b.hist.push(b.dead.slice());
  b.dead = [];
  b.pos++;
  if (b.pos >= COURSE.length) b.out = true;
}

function unscore(i){
  var b = S.balls[i];
  if (b.pos <= 0) return;
  b.pos--;
  b.out = false;
  if (b.hist.length) b.dead = b.hist.pop();
}

// --- rendering ------------------------------------------------------------
// Six rows at most, so the whole board is rebuilt on every change rather than
// diffed. Nothing here holds focus or scroll position that a rebuild loses.
function render(){
  if (!S) return;
  var n = S.balls.length, i, j;

  if (S.over) {
    $('banner').innerHTML = '<b>' + S.over + ' ' + (S.teams ? 'win' : 'wins') + '</b>' +
      '<span>Undo to keep playing, or start a new game.</span>';
  }

  var out = '';
  for (i = 0; i < n; i++) {
    var b = S.balls[i], me = META[b.c];
    var pct = Math.round(b.pos / COURSE.length * 100);

    var chips = '';
    for (j = 0; j < n; j++) {
      if (j === i) continue;
      var other = META[S.balls[j].c];
      chips += '<button class="dc" data-a="dead" data-i="' + i + '" data-j="' + j + '"' +
               ' style="--c:' + other.hex + ';--ring:' + other.ring + '"' +
               ' data-on="' + (b.dead.indexOf(j) >= 0) + '"' +
               ' aria-label="' + me.name + ' dead on ' + other.name + '"></button>';
    }

    // No text on the row: the colour block names the ball and the court below
    // says where it is, so the buttons only need to be an arrow and a minus.
    // The labels carry the wording for anyone not going by sight.
    out +=
    '<div class="card" data-out="' + b.out + '"' +
        ' style="--c:' + me.hex + ';--fg:' + me.fg + ';--ring:' + me.ring + '">' +
      '<span class="sw"></span>' +
      '<span class="dd">' + chips + '</span>' +
      '<button class="go" data-a="score" data-i="' + i + '"' +
        (b.out ? ' disabled' : '') + ' aria-label="' + me.name + ': ' +
        (b.out ? 'finished' : 'scored ' + COURSE[b.pos].toLowerCase()) + '">' +
        (b.out ? '&#10003;' : '&rarr;') + '</button>' +
      '<button class="back" data-a="back" data-i="' + i + '"' +
        (b.pos ? '' : ' disabled') + ' aria-label="' + me.name +
        ': take back a point">&minus;</button>' +
      '<i class="pb" style="width:calc((100% - var(--swW)) * ' + pct + ' / 100)"></i>' +
    '</div>';
  }
  $('cards').innerHTML = out;
  $('court').innerHTML = courtSvg();

  $('undo').disabled = !HIST.length;
}

// Every node -- nine hoops and two posts -- in one list, so a ball is placed by
// looking up whichever node claims the point it is playing for.
function nodes(){ return COURT.concat(POSTS); }
function n1(v){ return Math.round(v * 10) / 10; }   // keeps the path data legible
function nodeAt(x, y){ return { x: n1(x * BOX.w), y: n1(y * BOX.h) }; }
function nodeFor(pt){
  var all = nodes();
  for (var i = 0; i < all.length; i++) {
    if (all[i].pts.indexOf(pt) >= 0) return all[i];
  }
  return null;
}

function courtSvg(){
  var i, p, s = '';

  // boundary and the two diamonds, faint -- enough to read the shape of the
  // circuit without competing with the balls sitting on it
  s += '<rect x="2" y="2" width="' + (BOX.w - 4) + '" height="' + (BOX.h - 4) +
       '" rx="10" class="rail"/>';

  var ring = function(ids){
    return ids.map(function(k){
      var n = nodeAt(COURT[k].x, COURT[k].y);
      return n.x.toFixed(1) + ',' + n.y.toFixed(1);
    }).join(' ');
  };
  s += '<polygon points="' + ring([1, 2, 3, 8]) + '" class="rail"/>';
  s += '<polygon points="' + ring([3, 4, 5, 7]) + '" class="rail"/>';
  var a = nodeAt(POSTS[0].x, POSTS[0].y), b = nodeAt(COURT[1].x, COURT[1].y);
  s += '<path d="M' + a.x + ' ' + a.y + 'H' + b.x + '" class="rail"/>';
  var c = nodeAt(COURT[5].x, COURT[5].y), d = nodeAt(POSTS[1].x, POSTS[1].y);
  s += '<path d="M' + c.x + ' ' + c.y + 'H' + d.x + '" class="rail"/>';

  // posts. Their captions sit on the bottom edge, clear of the balls that
  // stack below the home post at the end of a game.
  for (i = 0; i < POSTS.length; i++) {
    p = nodeAt(POSTS[i].x, POSTS[i].y);
    // Centring the caption on the post would hang it off the edge, so each one
    // is anchored to the side of the box its post stands on.
    var right = POSTS[i].x > 0.5;
    s += '<rect x="' + n1(p.x - 2) + '" y="' + n1(p.y - 9) + '" width="4" height="18"' +
         ' rx="2" class="pegm"/>' +
         '<text x="' + (right ? BOX.w - 7 : 7) + '" y="' + (BOX.h - 5) +
         '" class="wn" style="text-anchor:' + (right ? 'end' : 'start') + '">' +
         POSTS[i].label + '</text>';
  }

  // hoops
  for (i = 0; i < COURT.length; i++) {
    p = nodeAt(COURT[i].x, COURT[i].y);
    s += '<path d="M' + n1(p.x - 7) + ' ' + n1(p.y + 6) +
         'v-4a7 7 0 0 1 14 0v4" class="wk"/>';
  }

  // Balls, blocked two abreast and up to three deep so a crowd stays compact:
  // above their hoop while they are heading out, below it on the way home. A
  // hoop that serves both legs therefore carries two separate blocks.
  var groups = {};
  for (i = 0; i < S.balls.length; i++) {
    var b = S.balls[i];
    var pt = b.out ? 15 : b.pos;
    var n = nodeFor(pt);
    if (!n) continue;
    var up = !b.out && pt <= 7;                 // 0..7 is the outbound leg
    var key = n.x + ':' + n.y + ':' + up;
    (groups[key] = groups[key] || { n:n, up:up, ids:[] }).ids.push(i);
  }
  Object.keys(groups).forEach(function(key){
    var g = groups[key], q = nodeAt(g.n.x, g.n.y), k = g.ids.length;
    var rows = Math.ceil(k / 2), cols = Math.min(k, 2);
    // 13px clears the arch; rows grow away from the hoop in both directions.
    var top = g.up ? q.y - 13 - (rows - 1) * GRID : q.y + 13;
    g.ids.forEach(function(id, idx){
      var m = META[S.balls[id].c];
      var dx = (idx % 2 - (cols - 1) / 2) * GRID;
      var dy = Math.floor(idx / 2) * GRID;
      s += '<circle cx="' + n1(q.x + dx) + '" cy="' + n1(top + dy) +
           '" r="5" fill="' + m.hex + '" stroke="' + m.ring + '"' +
           ' class="bm" data-out="' + S.balls[id].out + '"/>';
    });
  });

  return '<svg viewBox="0 0 ' + BOX.w + ' ' + BOX.h + '" role="img"' +
         ' aria-label="Court layout with each ball on the point it is playing for">' +
         s + '</svg>';
}

// --- input ----------------------------------------------------------------
$('cards').addEventListener('click', function(e){
  var hit = e.target.closest('[data-a]');
  if (!hit || hit.disabled) return;
  var i = +hit.dataset.i;

  if (hit.dataset.a === 'score') { act(function(){ scorePoint(i); }); return; }
  if (hit.dataset.a === 'back')  { act(function(){ unscore(i); }); return; }

  if (hit.dataset.a === 'dead') {
    var j = +hit.dataset.j;
    act(function(){
      var d = S.balls[i].dead, at = d.indexOf(j);
      if (at >= 0) d.splice(at, 1); else d.push(j);
    });
  }
});

$('undo').addEventListener('click', function(){
  if (!HIST.length) return;
  S = JSON.parse(HIST.pop());
  document.body.dataset.over = String(!!S.over);
  render(); save();
});

// --- boot -----------------------------------------------------------------
if (restore()) {
  document.body.dataset.view = 'game';
  document.body.dataset.over = String(!!S.over);
  render();
} else {
  syncSetup();
}

// Registering fails on file:// -- open the page over http(s) to install it.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
